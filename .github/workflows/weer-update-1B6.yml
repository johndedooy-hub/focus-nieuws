name: Create Omroep Brabant Forecast Fantastique MP3 1B.V6

on:
  workflow_dispatch:

jobs:
  process-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache TTS models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/tts
            ~/.cache/faster_whisper
            ~/.cache/torch
            ~/.cache/huggingface
          key: tts-whisper-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & FFmpeg
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            --default-timeout=60 \
            torchcodec

          python -m pip install \
            --default-timeout=60 \
            "transformers<4.40.0" \
            "scipy<1.13.0" \
            pydub \
            mutagen \
            requests \
            python-dateutil \
            TTS

          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Forecast Fantastique pipeline
        env:
          DRIVE_TXT_URL: 'https://focusfantastique.nl/weer-update.txt'
          COVER_IMAGE: 'weer-update.jpg'

          # Spraaksnelheid
          # 1.00 = normaal
          # 1.50 = sneller
          XTTS_SPEED: '1.50'

          # Pitch
          # 1.00 = origineel
          # 0.98 = heel subtiel lager
          # 0.95 = iets lager
          # 0.90 = duidelijk lager
          PITCH_FACTOR: '0.95'

          # Expressiviteit
          XTTS_TEMPERATURE: '0.75'
          XTTS_TOP_P: '0.85'
          XTTS_TOP_K: '50'

          XDG_CACHE_HOME: '/home/runner/.cache'
          TORCH_HOME: '/home/runner/.cache/torch'
          TRANSFORMERS_CACHE: '/home/runner/.cache/huggingface'

        run: |
          set -e

          python3 - <<'PYTHON'

          import os
          import sys
          import math
          import subprocess
          import requests

          from pydub import AudioSegment, effects
          from mutagen.id3 import (
              ID3,
              TIT2,
              TALB,
              APIC,
              ID3NoHeaderError
          )


          def fail(message):
              print("")
              print("FOUT:")
              print(message)
              sys.exit(1)


          # ============================================================
          # INSTELLINGEN
          # ============================================================

          drive_url = os.environ["DRIVE_TXT_URL"]

          cover_image = os.environ.get(
              "COVER_IMAGE",
              "weer-update.jpg"
          )

          speed = float(
              os.environ.get(
                  "XTTS_SPEED",
                  "1.50"
              )
          )

          pitch_factor = float(
              os.environ.get(
                  "PITCH_FACTOR",
                  "1.00"
              )
          )

          temperature = float(
              os.environ.get(
                  "XTTS_TEMPERATURE",
                  "0.75"
              )
          )

          top_p = float(
              os.environ.get(
                  "XTTS_TOP_P",
                  "0.85"
              )
          )

          top_k = int(
              os.environ.get(
                  "XTTS_TOP_K",
                  "50"
              )
          )


          print("==============================================")
          print("FORECAST FANTASTIQUE")
          print("==============================================")
          print("XTTS speed      :", speed)
          print("Pitch factor    :", pitch_factor)
          print("Temperature     :", temperature)
          print("Top-P           :", top_p)
          print("Top-K           :", top_k)
          print("==============================================")


          # ============================================================
          # TIJDELIJKE BESTANDEN OPRUIMEN
          # ============================================================

          for filename in [
              "raw.wav",
              "voice_pitched.wav",
              "clean_speaker.wav"
          ]:

              if os.path.exists(filename):
                  os.remove(filename)
                  print("Verwijderd:", filename)


          # ============================================================
          # TXT DOWNLOADEN
          # ============================================================

          print("")
          print("TXT downloaden...")

          try:

              response = requests.get(
                  drive_url,
                  timeout=60
              )

              response.raise_for_status()

              txt_data = response.text.strip()

          except Exception as error:

              fail(
                  f"Download van TXT mislukt: {error}"
              )


          if not txt_data:

              print(
                  "TXT is leeg. Workflow stopt netjes."
              )

              sys.exit(0)


          print("TXT succesvol gedownload.")


          # ============================================================
          # TRANSCRIPT
          # ============================================================

          transcript = (
              "Hallo, dit is de Focus Fantastiek Weer Update. "
              + txt_data
              + " En tot zover de update."
          )


          # ============================================================
          # TXT OPSLAAN
          # ============================================================

          try:

              with open(
                  "weer-update.txt",
                  "w",
                  encoding="utf-8"
              ) as text_file:

                  text_file.write(
                      transcript
                  )

          except Exception as error:

              fail(
                  f"Opslaan weer-update.txt mislukt: {error}"
              )


          print(
              "weer-update.txt aangemaakt."
          )


          # ============================================================
          # CPML TOS
          # ============================================================

          try:

              from TTS.utils.manage import ModelManager


              def skip_tos(
                  self,
                  output_path
              ):

                  print(
                      "CPML TOS automatisch geaccepteerd."
                  )

                  return True


              ModelManager.ask_tos = skip_tos

          except Exception as error:

              print(
                  "Waarschuwing TOS override:",
                  error
              )


          # ============================================================
          # TORCH SAFE GLOBALS
          # ============================================================

          try:

              import torch

              from TTS.tts.configs.xtts_config import (
                  XttsConfig
              )

              from TTS.tts.models.xtts import (
                  XttsAudioConfig,
                  XttsArgs
              )

              from TTS.config.shared_configs import (
                  BaseDatasetConfig
              )

              torch.serialization.add_safe_globals([
                  XttsConfig,
                  XttsAudioConfig,
                  XttsArgs,
                  BaseDatasetConfig
              ])

              print(
                  "Torch safe globals ingesteld."
              )

          except Exception as error:

              print(
                  "Waarschuwing safe globals:",
                  error
              )


          # ============================================================
          # XTTS MODEL
          # ============================================================

          from TTS.api import TTS


          model_name = (
              "tts_models/multilingual/"
              "multi-dataset/xtts_v2"
          )


          print("")
          print("XTTS model laden...")


          try:

              tts = TTS(
                  model_name
              )

          except Exception as error:

              fail(
                  f"XTTS laden mislukt: {error}"
              )


          print(
              "XTTS model geladen."
          )


          # ============================================================
          # SPEAKER
          # ============================================================

          speaker_source = "stem_voorbeeld.mp3"


          if not os.path.exists(
              speaker_source
          ):

              fail(
                  "stem_voorbeeld.mp3 ontbreekt."
              )


          print(
              "Speakerbestand verwerken..."
          )


          try:

              speaker = AudioSegment.from_file(
                  speaker_source
              )

              speaker = effects.normalize(
                  speaker
              )

              speaker = speaker.low_pass_filter(
                  9000
              )

              speaker = speaker.high_pass_filter(
                  100
              )

              speaker.export(
                  "clean_speaker.wav",
                  format="wav"
              )

          except Exception as error:

              fail(
                  f"Speaker verwerken mislukt: {error}"
              )


          print(
              "clean_speaker.wav aangemaakt."
          )


          # ============================================================
          # XTTS GENERATIE
          # ============================================================

          print("")
          print("Spraak genereren...")


          try:

              tts.tts_to_file(
                  text=transcript,
                  speaker_wav="clean_speaker.wav",
                  language="nl",
                  file_path="raw.wav",
                  speed=speed,
                  temperature=temperature,
                  top_p=top_p,
                  top_k=top_k
              )

              print(
                  "XTTS uitgevoerd met expressiviteitsinstellingen."
              )

          except TypeError:

              print(
                  "Expressiviteitsinstellingen worden niet "
                  "ondersteund door deze TTS-versie."
              )

              print(
                  "Normale XTTS-aanroep wordt gebruikt."
              )

              try:

                  tts.tts_to_file(
                      text=transcript,
                      speaker_wav="clean_speaker.wav",
                      language="nl",
                      file_path="raw.wav",
                      speed=speed
                  )

              except Exception as error:

                  fail(
                      f"XTTS generatie mislukt: {error}"
                  )

          except Exception as error:

              fail(
                  f"XTTS generatie mislukt: {error}"
              )


          # ============================================================
          # RAW WAV CONTROLEREN
          # ============================================================

          if not os.path.exists(
              "raw.wav"
          ):

              fail(
                  "raw.wav is niet aangemaakt."
              )


          raw_size = os.path.getsize(
              "raw.wav"
          )


          if raw_size <= 0:

              fail(
                  "raw.wav is leeg."
              )


          print(
              "raw.wav aangemaakt:",
              raw_size,
              "bytes"
          )


          # ============================================================
          # PITCH
          # ============================================================

          if abs(
              pitch_factor - 1.0
          ) < 0.001:

              voice_file = "raw.wav"

              print(
                  "Pitch: origineel."
              )

          else:

              print(
                  "Pitch aanpassen..."
              )

              try:

                  probe = subprocess.run(
                      [
                          "ffprobe",
                          "-v",
                          "error",
                          "-select_streams",
                          "a:0",
                          "-show_entries",
                          "stream=sample_rate",
                          "-of",
                          "default="
                          "noprint_wrappers=1:"
                          "nokey=1",
                          "raw.wav"
                      ],
                      capture_output=True,
                      text=True,
                      check=True
                  )

              except Exception as error:

                  fail(
                      f"ffprobe mislukt: {error}"
                  )


              sample_rate_text = (
                  probe.stdout.strip()
              )


              if not sample_rate_text:

                  fail(
                      "Sample rate kon niet worden bepaald."
                  )


              sample_rate = int(
                  sample_rate_text
              )


              new_rate = int(
                  sample_rate * pitch_factor
              )


              tempo_correction = (
                  1.0 / pitch_factor
              )


              if (
                  tempo_correction < 0.5
                  or tempo_correction > 2.0
              ):

                  fail(
                      "PITCH_FACTOR geeft een ongeldig "
                      "tempo-correctiebereik."
                  )


              try:

                  subprocess.run(
                      [
                          "ffmpeg",
                          "-y",
                          "-i",
                          "raw.wav",
                          "-filter:a",
                          (
                              f"asetrate={new_rate},"
                              f"aresample={sample_rate},"
                              f"atempo={tempo_correction}"
                          ),
                          "voice_pitched.wav"
                      ],
                      check=True
                  )

              except Exception as error:

                  fail(
                      f"Pitchbewerking mislukt: {error}"
                  )


              if not os.path.exists(
                  "voice_pitched.wav"
              ):

                  fail(
                      "voice_pitched.wav is niet aangemaakt."
                  )


              voice_file = (
                  "voice_pitched.wav"
              )


              print(
                  "Pitch succesvol aangepast."
              )
                       # ============================================================
          # VOICE LADEN EN NORMALISEREN
          # ============================================================

          try:

              voice = AudioSegment.from_file(
                  voice_file
              )

              voice = effects.normalize(
                  voice
              )

          except Exception as error:

              fail(
                  f"Voice verwerken mislukt: {error}"
              )


          # ============================================================
          # NEWSBED
          # ============================================================

          final = voice

          bed_file = "weer-update-bed.mp3"


          if os.path.exists(
              bed_file
          ):

              print(
                  "Newsbed gevonden."
              )

              try:

                  bed = AudioSegment.from_file(
                      bed_file
                  )

                  bed = bed - 20


                  if (
                      len(bed) > 0
                      and len(bed) < len(voice)
                  ):

                      repeat_count = math.ceil(
                          len(voice) / len(bed)
                      )

                      bed = bed * repeat_count


                  bed = bed[
                      :len(voice)
                  ]


                  final = bed.overlay(
                      voice
                  )


                  print(
                      "Newsbed toegevoegd."
                  )


              except Exception as error:

                  print(
                      "Waarschuwing newsbed:",
                      error
                  )

                  final = voice

          else:

              print(
                  "Geen newsbed gevonden; alleen stem."
              )


          # ============================================================
          # MP3 EXPORT
          #
          # Dit overschrijft een bestaande weer-update.mp3.
          # ============================================================

          print("")
          print(
              "weer-update.mp3 maken..."
          )


          try:

              final.export(
                  "weer-update.mp3",
                  format="mp3",
                  bitrate="128k"
              )

          except Exception as error:

              fail(
                  f"MP3 export mislukt: {error}"
              )


          # ============================================================
          # MP3 CONTROLEREN
          # ============================================================

          if not os.path.exists(
              "weer-update.mp3"
          ):

              fail(
                  "weer-update.mp3 is NIET aangemaakt."
              )


          mp3_size = os.path.getsize(
              "weer-update.mp3"
          )


          if mp3_size <= 0:

              fail(
                  "weer-update.mp3 is leeg."
              )


          print(
              "weer-update.mp3 aangemaakt:",
              mp3_size,
              "bytes"
          )


          # ============================================================
          # ID3 TAGS
          # ============================================================

          try:

              try:

                  id3 = ID3(
                      "weer-update.mp3"
                  )

              except ID3NoHeaderError:

                  id3 = ID3()


              id3.add(
                  TIT2(
                      encoding=3,
                      text="Weer Update"
                  )
              )


              id3.add(
                  TALB(
                      encoding=3,
                      text="Weer Update"
                  )
              )

          # --------------------------------------------------------
              # COVER
              # --------------------------------------------------------

              if os.path.exists(
                  cover_image
              ):

                  with open(
                      cover_image,
                      "rb"
                  ) as image_file:

                      id3.add(
                          APIC(
                              encoding=3,
                              mime="image/jpeg",
                              type=3,
                              desc="Cover",
                              data=image_file.read()
                          )
                      )


                  print(
                      "Cover toegevoegd."
                  )

              else:

                  print(
                      "Geen cover gevonden:",
                      cover_image
                  )


              id3.save(
                  "weer-update.mp3"
              )


              print(
                  "ID3 tags opgeslagen."
              )


          except Exception as error:

              print(
                  "Waarschuwing ID3:",
                  error
              )


          # ============================================================
          # DEFINITIEVE CONTROLE
          # ============================================================

          if not os.path.exists(
              "weer-update.mp3"
          ):

              fail(
                  "Definitieve controle mislukt."
              )


          print("")
          print("==============================================")
          print("PIPELINE SUCCESVOL")
          print("==============================================")
          print("weer-update.txt : OK")
          print("weer-update.mp3 : OK")
          print("Speed           :", speed)
          print("Pitch           :", pitch_factor)
          print("Temperature     :", temperature)
          print("Top-P           :", top_p)
          print("Top-K           :", top_k)
          print("==============================================")


          PYTHON


      # ================================================================
      # OUTPUT CONTROLEREN
      # ================================================================

      - name: Controleer output
        run: |
          set -e

          echo "Outputbestanden:"

          ls -lh \
            weer-update.txt \
            weer-update.mp3

          echo ""
          echo "MP3 controleren met ffprobe:"

          ffprobe \
            -v error \
            -show_entries format=filename,duration,size \
            -of default=noprint_wrappers=1 \
            weer-update.mp3


      # ================================================================
      # COMMIT EN PUSH
      # ================================================================

      - name: Commit and push changes
        run: |
          set -e

          git config \
            --local \
            user.email \
            "action@github.com"

          git config \
            --local \
            user.name \
            "GitHub Action"

          echo "Git status vóór add:"
          git status --short

          git add \
            weer-update.mp3 \
            weer-update.txt

          echo ""
          echo "Git status na add:"
          git status --short

          if git diff --cached --quiet; then

            echo "Geen wijzigingen om te committen."

            exit 0

          fi

          git commit \
            -m "FAST Update: Weer Update - UTC+2 $(date '+%H:%M')"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main

          echo ""
          echo "PUSH SUCCESVOL."
          
