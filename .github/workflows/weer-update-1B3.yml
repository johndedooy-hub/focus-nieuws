name: Create Omroep Brabant Forecast Fantastique MP3 1B.3

on:
  workflow_dispatch:

jobs:
  process-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ================================================================
      # CACHE TTS MODELS
      # ================================================================

      - name: Cache TTS models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/tts
            ~/.cache/faster_whisper
            ~/.cache/torch
            ~/.cache/huggingface
          key: tts-whisper-cache


      # ================================================================
      # PYTHON
      # ================================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ================================================================
      # DEPENDENCIES + FFMPEG
      # ================================================================

      - name: Install dependencies & FFmpeg
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            --default-timeout=60 \
            torchcodec

          python -m pip install \
            --default-timeout=60 \
            "transformers<4.40.0" \
            "scipy<1.13.0" \
            pydub \
            mutagen \
            requests \
            python-dateutil \
            TTS

          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ================================================================
      # RUN FORECAST FANTASTIQUE PIPELINE
      # ================================================================

      - name: Run Forecast Fantastique pipeline
        env:

          # ------------------------------------------------------------
          # BRONBESTAND
          # ------------------------------------------------------------

          DRIVE_TXT_URL: 'https://focusfantastique.nl/weer-update.txt'


          # ------------------------------------------------------------
          # COVER
          # ------------------------------------------------------------

          COVER_IMAGE: 'weer-update.jpg'


          # ------------------------------------------------------------
          # XTTS SNELHEID
          #
          # 1.00 = normaal
          # 1.50 = snel
          # ------------------------------------------------------------

          XTTS_SPEED: '1.50'


          # ------------------------------------------------------------
          # PITCH
          #
          # 1.00 = origineel
          # 0.98 = heel subtiel lager
          # 0.95 = iets lager
          # 0.90 = duidelijk lager
          # 1.05 = iets hoger
          # ------------------------------------------------------------

          PITCH_FACTOR: '0.95'


          # ------------------------------------------------------------
          # XTTS EXPRESSIVITEIT
          #
          # Temperature lager = rustiger
          # Temperature hoger = meer variatie
          # ------------------------------------------------------------

          XTTS_TEMPERATURE: '0.75'

          XTTS_TOP_P: '0.85'

          XTTS_TOP_K: '50'


          # ------------------------------------------------------------
          # CACHE
          # ------------------------------------------------------------

          XDG_CACHE_HOME: '/home/runner/.cache'

          TORCH_HOME: '/home/runner/.cache/torch'

          TRANSFORMERS_CACHE: '/home/runner/.cache/huggingface'


        run: |

          set -e

          python3 - <<'EOF'

          import os
          import sys
          import math
          import subprocess
          import requests

          from pydub import AudioSegment, effects

          from mutagen.id3 import (
              ID3,
              TIT2,
              TALB,
              APIC,
              ID3NoHeaderError
          )


          # ============================================================
          # HULPFUNCTIE
          # ============================================================

          def exit_with(message, code=1):

              print(message)

              sys.exit(code)


          # ============================================================
          # INSTELLINGEN
          # ============================================================

          url = os.environ["DRIVE_TXT_URL"]

          cover_image = os.environ.get(
              "COVER_IMAGE",
              "weer-update.jpg"
          )

          speed = float(
              os.environ.get(
                  "XTTS_SPEED",
                  "1.50"
              )
          )

          pitch_factor = float(
              os.environ.get(
                  "PITCH_FACTOR",
                  "1.00"
              )
          )

          temperature = float(
              os.environ.get(
                  "XTTS_TEMPERATURE",
                  "0.75"
              )
          )

          top_p = float(
              os.environ.get(
                  "XTTS_TOP_P",
                  "0.85"
              )
          )

          top_k = int(
              os.environ.get(
                  "XTTS_TOP_K",
                  "50"
              )
          )


          print("")
          print("================================================")
          print("FORECAST FANTASTIQUE INSTELLINGEN")
          print("================================================")
          print("XTTS snelheid :", speed)
          print("Pitch factor   :", pitch_factor)
          print("Temperature    :", temperature)
          print("Top-P          :", top_p)
          print("Top-K          :", top_k)
          print("================================================")
          print("")


          # ============================================================
          # OUDE OUTPUT VERWIJDEREN
          #
          # Iedere run begint opnieuw.
          # ============================================================

          for filename in [
              "weer-update.mp3",
              "weer-update.txt",
              "raw.wav",
              "voice_pitched.wav",
              "clean_speaker.wav"
          ]:

              if os.path.exists(filename):

                  os.remove(filename)

                  print(
                      "Bestaand bestand verwijderd:",
                      filename
                  )


          # ============================================================
          # TXT DOWNLOADEN
          # ============================================================

          print(
              "Download weer-update.txt..."
          )


          try:

              response = requests.get(
                  url,
                  timeout=60
              )

              response.raise_for_status()

              txt_data = response.text.strip()


          except Exception as e:

              exit_with(
                  f"Fout bij downloaden TXT: {e}"
              )


          if not txt_data:

              print(
                  "TXT bestand is leeg — "
                  "workflow stopt netjes."
              )

              raise SystemExit(0)


          print(
              "TXT succesvol ontvangen."
          )


          # ============================================================
          # TRANSCRIPT
          # ============================================================

          transcript = (

              "Hallo, dit is de Focus Fantastiek "
              "Weer Update.\n"

              + txt_data

              + "\nEn tot zover de update."

          )


          # ============================================================
          # TXT OPSLAAN
          # ============================================================

          try:

              with open(
                  "weer-update.txt",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      transcript
                  )


          except Exception as e:

              exit_with(
                  f"Fout bij opslaan weer-update.txt: {e}"
              )


          print(
              "weer-update.txt aangemaakt."
          )


          # ============================================================
          # CPML TOS
          # ============================================================

          try:

              from TTS.utils.manage import ModelManager


              def _skip_tos(
                  self,
                  output_path
              ):

                  print(
                      "CPML TOS automatisch "
                      "geaccepteerd (CI)."
                  )

                  return True


              ModelManager.ask_tos = _skip_tos


          except Exception as e:

              print(
                  "Waarschuwing: CPML TOS override "
                  f"kon niet worden ingesteld: {e}"
              )


          # ============================================================
          # PYTORCH SAFE GLOBALS
          # ============================================================

          import torch

          from TTS.tts.configs.xtts_config import (
              XttsConfig
          )

          from TTS.tts.models.xtts import (
              XttsAudioConfig,
              XttsArgs
          )

          from TTS.config.shared_configs import (
              BaseDatasetConfig
          )


          try:

              torch.serialization.add_safe_globals([

                  XttsConfig,

                  XttsAudioConfig,

                  XttsArgs,

                  BaseDatasetConfig

              ])


              print(
                  "Torch safe globals toegevoegd."
              )


          except Exception as e:

              print(
                  "Waarschuwing: safe globals konden "
                  f"niet worden toegevoegd: {e}"
              )


          # ============================================================
          # XTTS MODEL
          # ============================================================

          from TTS.utils.manage import ModelManager

          from TTS.api import TTS


          model_name = (
              "tts_models/multilingual/"
              "multi-dataset/xtts_v2"
          )


          model_path = None


          try:

              manager = ModelManager()


              print(
                  "XTTS model downloaden/controleren..."
              )


              model_path, config_path, model_item = (
                  manager.download_model(
                      model_name
                  )
              )


              print(
                  "XTTS model beschikbaar:"
              )

              print(
                  model_path
              )


          except Exception as e:

              exit_with(
                  "Fout bij downloaden XTTS model: "
                  f"{e}"
              )


          # ============================================================
          # XTTS INITIALISEREN
          # ============================================================

          try:

              tts = TTS(
                  model_path
                  if model_path
                  else model_name
              )


              print(
                  "XTTS succesvol geladen."
              )


          except Exception as e:

              exit_with(
                  "Fout bij laden XTTS model: "
                  f"{e}"
              )


          # ============================================================
          # SPEAKER
          # ============================================================

          speaker_src = (
              "stem_voorbeeld.mp3"
          )


          if not os.path.exists(
              speaker_src
          ):

              exit_with(
                  "stem_voorbeeld.mp3 ontbreekt."
              )


          try:

              speaker = (
                  AudioSegment.from_file(
                      speaker_src
                  )
              )


              speaker = (
                  effects.normalize(
                      speaker
                  )
              )


              speaker = (
                  speaker.low_pass_filter(
                      9000
                  )
              )


              speaker = (
                  speaker.high_pass_filter(
                      100
                  )
              )


              speaker.export(
                  "clean_speaker.wav",
                  format="wav"
              )


              print(
                  "clean_speaker.wav aangemaakt."
              )


          except Exception as e:

              exit_with(
                  "Fout bij verwerken "
                  f"{speaker_src}: {e}"
              )


          # ============================================================
          # TTS
          #
          # Eerst proberen met de expressiviteitsinstellingen.
          # Als de gebruikte TTS-versie deze parameters niet kent,
          # valt het script terug op de normale XTTS-aanroep.
          # ============================================================

          print(
              "XTTS spraak genereren..."
          )


          try:

              tts.tts_to_file(

                  text=transcript,

                  speaker_wav="clean_speaker.wav",

                  language="nl",

                  file_path="raw.wav",

                  speed=speed,

                  temperature=temperature,

                  top_p=top_p,

                  top_k=top_k

              )


              print(
                  "XTTS expressiviteitsinstellingen gebruikt."
              )


          except TypeError:

              print(
                  "Deze XTTS-versie accepteert geen "
                  "expressiviteitsparameters."
              )

              print(
                  "Standaard XTTS wordt gebruikt."
              )


              tts.tts_to_file(

                  text=transcript,

                  speaker_wav="clean_speaker.wav",

                  language="nl",

                  file_path="raw.wav",

                  speed=speed

              )


          except Exception as e:

              exit_with(
                  "Fout tijdens TTS generatie: "
                  f"{e}"
              )


          # ============================================================
          # RAW.WAV CONTROLEREN
          # ============================================================

          if not os.path.exists(
              "raw.wav"
          ):

              exit_with(
                  "XTTS heeft geen raw.wav gemaakt."
              )


          print(
              "raw.wav aangemaakt."
          )


          # ============================================================
          # PITCH
          # ============================================================

          if abs(
              pitch_factor - 1.00
          ) < 0.001:

              voice_file = (
                  "raw.wav"
              )


              print(
                  "Pitch blijft origineel."
              )


          else:

              print(
                  "Pitch aanpassen:",
                  pitch_factor
              )


              # --------------------------------------------------------
              # Sample rate bepalen
              # --------------------------------------------------------

              probe = subprocess.run(

                  [

                      "ffprobe",

                      "-v",
                      "error",

                      "-select_streams",
                      "a:0",

                      "-show_entries",
                      "stream=sample_rate",

                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",

                      "raw.wav"

                  ],

                  capture_output=True,

                  text=True,

                  check=True

              )


              sample_rate_text = (
                  probe.stdout.strip()
              )


              if not sample_rate_text:

                  exit_with(
                      "Sample rate van raw.wav "
                      "kon niet worden bepaald."
                  )


              sample_rate = int(
                  sample_rate_text
              )


              new_rate = int(
                  sample_rate * pitch_factor
              )


              # --------------------------------------------------------
              # Tempo terug corrigeren
              # --------------------------------------------------------

              tempo_correction = (
                  1.0 / pitch_factor
              )


              if (
                  tempo_correction < 0.5
                  or tempo_correction > 2.0
              ):

                  exit_with(
                      "PITCH_FACTOR ligt buiten het "
                      "veilige bereik. Gebruik bijvoorbeeld "
                      "0.85 t/m 1.15."
                  )


              subprocess.run(

                  [

                      "ffmpeg",

                      "-y",

                      "-i",
                      "raw.wav",

                      "-filter:a",

                      (
                          f"asetrate={new_rate},"
                          f"aresample={sample_rate},"
                          f"atempo={tempo_correction}"
                      ),

                      "voice_pitched.wav"

                  ],

                  check=True

              )


              if not os.path.exists(
                  "voice_pitched.wav"
              ):

                  exit_with(
                      "voice_pitched.wav "
                      "is niet aangemaakt."
                  )


              voice_file = (
                  "voice_pitched.wav"
              )


              print(
                  "Pitch succesvol aangepast."
              )


          # ============================================================
          # STEM LADEN + NORMALISEREN
          # ============================================================

          try:

              voice = (
                  AudioSegment.from_file(
                      voice_file
                  )
              )


              voice = (
                  effects.normalize(
                      voice
                  )
              )


          except Exception as e:

              exit_with(
                  "Fout bij laden stem: "
                  f"{e}"
              )


          # ============================================================
          # NEWSBED
          # ============================================================

          final = voice

          bed_file = (
              "weer-update-bed.mp3"
          )


          if os.path.exists(
              bed_file
          ):

              print(
                  "Newsbed gevonden."
              )


              try:

                  bed = (
                      AudioSegment.from_file(
                          bed_file
                      )
                  )


                  # ----------------------------------------------------
                  # Newsbed 20 dB zachter
                  # ----------------------------------------------------

                  b    
