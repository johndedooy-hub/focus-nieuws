name: Create Omroep Brabant Forecast Fantastique MP3 1B3

on:
  workflow_dispatch:

jobs:
  process-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ================================================================
      # CACHE TTS MODELS
      # ================================================================

      - name: Cache TTS models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/tts
            ~/.cache/faster_whisper
            ~/.cache/torch
            ~/.cache/huggingface
          key: tts-whisper-cache


      # ================================================================
      # PYTHON
      # ================================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ================================================================
      # DEPENDENCIES + FFMPEG
      # ================================================================

      - name: Install dependencies & FFmpeg
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            --default-timeout=60 \
            torchcodec

          python -m pip install \
            --default-timeout=60 \
            "transformers<4.40.0" \
            "scipy<1.13.0" \
            pydub \
            mutagen \
            requests \
            python-dateutil \
            TTS

          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ================================================================
      # FORECAST FANTASTIQUE PIPELINE
      # ================================================================

      - name: Run Forecast Fantastique pipeline
        env:

          # ------------------------------------------------------------
          # BRONBESTAND
          # ------------------------------------------------------------

          DRIVE_TXT_URL: 'https://focusfantastique.nl/weer-update.txt'


          # ------------------------------------------------------------
          # BESTANDEN
          # ------------------------------------------------------------

          COVER_IMAGE: 'weer-update.jpg'


          # ------------------------------------------------------------
          # XTTS SNELHEID
          # ------------------------------------------------------------

          XTTS_SPEED: '1.50'


          # ------------------------------------------------------------
          # PITCH
          #
          # 1.00 = originele toonhoogte
          # 0.98 = heel subtiel lager
          # 0.95 = iets lager
          # 0.90 = duidelijk lager
          # 0.85 = behoorlijk lager
          #
          # Voor eerste test:
          # 0.95
          # ------------------------------------------------------------

          PITCH_FACTOR: '0.95'


          # ------------------------------------------------------------
          # XTTS EXPRESSIVITEIT
          #
          # Deze waarden worden gebruikt wanneer de geïnstalleerde
          # XTTS-versie deze parameters accepteert.
          #
          # Temperature hoger = meer variatie
          # Temperature lager = rustiger / voorspelbaarder
          # ------------------------------------------------------------

          XTTS_TEMPERATURE: '0.75'
          XTTS_TOP_P: '0.85'
          XTTS_TOP_K: '50'


          # ------------------------------------------------------------
          # CACHE
          # ------------------------------------------------------------

          XDG_CACHE_HOME: '/home/runner/.cache'
          TORCH_HOME: '/home/runner/.cache/torch'
          TRANSFORMERS_CACHE: '/home/runner/.cache/huggingface'


        run: |

          set -e

          python3 - <<'EOF'

          import os
          import sys
          import math
          import subprocess
          import requests

          from pydub import AudioSegment, effects

          from mutagen.id3 import (
              ID3,
              TIT2,
              TALB,
              APIC,
              ID3NoHeaderError
          )


          # ============================================================
          # HULPFUNCTIE
          # ============================================================

          def exit_with(message, code=1):
              print(message)
              sys.exit(code)


          # ============================================================
          # INSTELLINGEN
          # ============================================================

          drive_txt_url = os.environ.get(
              "DRIVE_TXT_URL"
          )

          cover_image = os.environ.get(
              "COVER_IMAGE",
              "weer-update.jpg"
          )


          try:
              speed = float(
                  os.environ.get(
                      "XTTS_SPEED",
                      "1.50"
                  )
              )
          except Exception:
              speed = 1.50


          try:
              pitch_factor = float(
                  os.environ.get(
                      "PITCH_FACTOR",
                      "1.00"
                  )
              )
          except Exception:
              pitch_factor = 1.00


          try:
              temperature = float(
                  os.environ.get(
                      "XTTS_TEMPERATURE",
                      "0.75"
                  )
              )
          except Exception:
              temperature = 0.75


          try:
              top_p = float(
                  os.environ.get(
                      "XTTS_TOP_P",
                      "0.85"
                  )
              )
          except Exception:
              top_p = 0.85


          try:
              top_k = int(
                  os.environ.get(
                      "XTTS_TOP_K",
                      "50"
                  )
              )
          except Exception:
              top_k = 50


          print("")
          print("================================================")
          print("FORECAST FANTASTIQUE INSTELLINGEN")
          print("================================================")
          print("XTTS snelheid :", speed)
          print("Pitch factor   :", pitch_factor)
          print("Temperature    :", temperature)
          print("Top-P          :", top_p)
          print("Top-K          :", top_k)
          print("================================================")
          print("")


          # ============================================================
          # TXT DOWNLOADEN
          # ============================================================

          if not drive_txt_url:
              exit_with(
                  "DRIVE_TXT_URL is niet ingesteld."
              )


          print("Download weer-update.txt...")


          try:

              response = requests.get(
                  drive_txt_url,
                  timeout=60
              )

              response.raise_for_status()

              txt_data = response.text

          except Exception as e:

              exit_with(
                  f"Fout bij downloaden TXT: {e}"
              )


          txt_data = txt_data.strip()


          if not txt_data:

              print(
                  "TXT bestand is leeg — workflow stopt netjes."
              )

              raise SystemExit(0)


          print("TXT succesvol ontvangen.")


          # ============================================================
          # TRANSCRIPT
          # ============================================================

          transcript = (
              "Hallo, dit is de Focus Fantastiek Weer Update.\n"
              + txt_data
              + "\nEn tot zover de update."
          )


          # ============================================================
          # TXT OPSLAAN
          # ============================================================

          try:

              with open(
                  "weer-update.txt",
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(transcript)

          except Exception as e:

              exit_with(
                  f"Fout bij opslaan weer-update.txt: {e}"
              )


          print("weer-update.txt opgeslagen.")


          # ============================================================
          # CPML TOS
          # ============================================================

          try:

              from TTS.utils.manage import ModelManager


              def _skip_tos(self, output_path):

                  print(
                      "CPML TOS automatisch geaccepteerd (CI)."
                  )

                  return True


              ModelManager.ask_tos = _skip_tos


          except Exception as e:

              print(
                  "Waarschuwing: CPML TOS override "
                  f"kon niet worden ingesteld: {e}"
              )


          # ============================================================
          # XTTS MODEL DOWNLOADEN
          # ============================================================

          model_name = (
              "tts_models/multilingual/"
              "multi-dataset/xtts_v2"
          )


          model_path = None


          try:

              manager = ModelManager()

              print(
                  "Start XTTS model download..."
              )

              model_path, config_path, model_item = (
                  manager.download_model(model_name)
              )

              print(
                  "XTTS model gedownload naar:"
              )

              print(model_path)

          except Exception as e:

              exit_with(
                  "Fout bij downloaden XTTS model: "
                  f"{e}"
              )


          # ============================================================
          # PYTORCH SAFE GLOBALS
          # ============================================================

          try:

              import torch

              from TTS.tts.configs.xtts_config import (
                  XttsConfig
              )

              from TTS.tts.models.xtts import (
                  XttsAudioConfig,
                  XttsArgs
              )

              from TTS.config.shared_configs import (
                  BaseDatasetConfig
              )


              torch.serialization.add_safe_globals([
                  XttsConfig,
                  XttsAudioConfig,
                  XttsArgs,
                  BaseDatasetConfig
              ])


              print(
                  "Torch safe globals toegevoegd."
              )


          except Exception as e:

              print(
                  "Waarschuwing: safe globals konden "
                  f"niet worden ingesteld: {e}"
              )


          # ============================================================
          # TTS IMPORTEREN
          # ============================================================

          try:

              from TTS.api import TTS

          except Exception as e:

              exit_with(
                  f"Fout bij import TTS.api: {e}"
              )


          # ============================================================
          # XTTS INITIALISEREN
          # ============================================================

          try:

              tts_source = (
                  model_path
                  if model_path
                  else model_name
              )


              print(
                  "XTTS initialiseren..."
              )


              tts = TTS(
                  tts_source
              )


              print(
                  "XTTS succesvol geladen."
              )


          except Exception as e:

              exit_with(
                  "Fout bij laden XTTS model: "
                  f"{e}"
              )


          # ============================================================
          # SPEAKER VERWERKEN
          # ============================================================

          speaker_src = "stem_voorbeeld.mp3"


          if not os.path.exists(
              speaker_src
          ):

              print(
                  "stem_voorbeeld.mp3 niet gevonden."
              )

              print(
                  "Stille fallback wordt gebruikt."
              )


              silent = AudioSegment.silent(
                  duration=1000
              )


              silent.export(
                  "clean_speaker.wav",
                  format="wav"
              )


          else:

              try:

                  print(
                      "Stemvoorbeeld verwerken..."
                  )


                  speaker = AudioSegment.from_file(
                      speaker_src
                  )


                  speaker = effects.normalize(
                      speaker
                  )


                  speaker = speaker.low_pass_filter(
                      9000
                  )


                  speaker = speaker.high_pass_filter(
                      100
                  )


                  speaker.export(
                      "clean_speaker.wav",
                      format="wav"
                  )


                  print(
                      "clean_speaker.wav aangemaakt."
                  )


              except Exception as e:

                  exit_with(
                      "Fout bij verwerken "
                      f"{speaker_src}: {e}"
                  )


          # ============================================================
          # TTS GENEREREN
          # ============================================================

          print(
              "XTTS spraak genereren..."
          )


          tts_parameters_supported = True


          try:

              tts.tts_to_file(

                  text=transcript,

                  speaker_wav="clean_speaker.wav",

                  language="nl",

                  file_path="raw.wav",

                  speed=speed,

                  temperature=temperature,

                  top_p=top_p,

                  top_k=top_k

              )


          except TypeError:

              # --------------------------------------------------------
              # Sommige TTS-versies accepteren deze parameters niet.
              # Dan gebruiken we automatisch de standaard XTTS-aanroep.
              # --------------------------------------------------------

              tts_parameters_supported = False


              print(
                  "Expressiviteitsparameters worden niet "
                  "ondersteund door deze TTS-versie."
              )

              print(
                  "Standaard XTTS-aanroep wordt gebruikt."
              )


              tts.tts_to_file(

                  text=transcript,

                  speaker_wav="clean_speaker.wav",

                  language="nl",

                  file_path="raw.wav",

                  speed=speed

              )


          except Exception as e:

              exit_with(
                  "Fout tijdens TTS generatie: "
                  f"{e}"
              )


          # ============================================================
          # RAW.WAV CONTROLEREN
          # ============================================================

          if not os.path.exists(
              "raw.wav"
          ):

              exit_with(
                  "raw.wav niet aangemaakt door TTS."
              )


          print(
              "raw.wav succesvol aangemaakt."
          )


          # ============================================================
          # PITCH AANPASSEN
          #
          # 1.00 = originele pitch
          #
          # Bij een andere waarde wordt de pitch aangepast en daarna
          # wordt het tempo terug gecorrigeerd.
          # ============================================================

          if abs(
              pitch_factor - 1.00
          ) < 0.001:

              print(
                  "Pitch: origineel (1.00)."
              )

              voice_file = "raw.wav"


          else:

              print(
                  "Pitch aanpassen naar factor:",
                  pitch_factor
              )


              pitch_output = (
                  "voice_pitched.wav"
              )


              # --------------------------------------------------------
              # Sample rate bepalen
              # --------------------------------------------------------

              probe = subprocess.run(

                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-select_streams",
                      "a:0",
                      "-show_entries",
                      "stream=sample_rate",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      "raw.wav"
                  ],

                  capture_output=True,

                  text=True,

                  check=True

              )


              sample_rate_text = (
                  probe.stdout.strip()
              )


              if not sample_rate_text:

                  exit_with(
                      "Kon sample rate van raw.wav "
                      "niet bepalen."
                  )


              sample_rate = int(
                  sample_rate_text
              )


              new_rate = int(
                  sample_rate * pitch_factor
              )


              # --------------------------------------------------------
              # Pitch wijzigen zonder blijvende tempoverandering.
              #
              # asetrate verandert tijdelijk zowel pitch als lengte.
              # atempo corrigeert daarna de lengte terug.
              # --------------------------------------------------------

              tempo_correction = (
                  1.0 / pitch_factor
              )


              # FFmpeg atempo accepteert waarden binnen een bepaald
              # bereik. Voor onze normale pitch-factoren is één filter
              # voldoende.

              if (
                  tempo_correction < 0.5
                  or tempo_correction > 2.0
              ):

                  exit_with(
                      "PITCH_FACTOR ligt buiten het "
                      "veilige bereik. Gebruik bijvoorbeeld "
                      "0.85 t/m 1.15."
                  )


              subprocess.run(

                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      "raw.wav",

                      "-filter:a",

                      (
                          f"asetrate={new_rate},"
                          f"aresample={sample_rate},"
                          f"atempo={tempo_correction}"
                      ),

                      pitch_output
                  ],

                  check=True

              )


              if not os.path.exists(
                  pitch_output
              ):

                  exit_with(
                      "voice_pitched.wav werd niet aangemaakt."
                  )


              voice_file = (
                  pitch_output
              )


              print(
                  "Pitch succesvol aangepast."
              )


          # ============================================================
        
