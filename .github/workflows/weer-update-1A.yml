name: Run Omroep Brabant Forecast Fantastique

on:
  workflow_dispatch:

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Haal forecast op en publiceer
        shell: python
        run: |
          import requests
          import json
          import os

          SOURCE_URL = "https://www.omroepbrabant.nl/weer"
          OUTPUT_URL = "https://focusfantastique.nl/weer-update.php"
          OUTPUT_URL_LANGSTRAAT = "https://focusfantastique.nl/langstraat-weer.php"

          # Omroep Brabant ophalen
          response = requests.get(
              SOURCE_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=30
          )
          response.raise_for_status()

          html = response.text

          # Begin en einde van de forecast
          start_marker = '"forecast":"'
          end_marker = '","mapURL'

          start = html.find(start_marker)

          if start == -1:
              raise Exception("Start-marker 'forecast' niet gevonden")

          start += len(start_marker)

          end = html.find(end_marker, start)

          if end == -1:
              raise Exception("Eind-marker 'mapURL' niet gevonden")

          # Alleen de forecast eruit halen
          forecast = html[start:end]

          # JSON escaping correct decoderen
          forecast = json.loads('"' + forecast + '"')

          forecast = forecast.strip()

          print("Gevonden forecast:")
          print("--------------------------------")
          print(forecast)
          print("--------------------------------")

          if not forecast:
              raise Exception("Forecast is leeg")

          # Naar focusfantastique.nl schrijven (Weer Update)
          upload = requests.put(
              OUTPUT_URL,
              data=forecast.encode("utf-8"),
              headers={
                  "Content-Type": "text/plain; charset=utf-8"
              },
              timeout=30
          )

          print(f"Weer-update upload HTTP status: {upload.status_code}")

          upload.raise_for_status()

          print("Weer-update succesvol gepubliceerd.")

          # --- Langstraat-Weer: maak aparte tekstversie en publiceer ---
          # Begin en einde exact zoals gevraagd
          lang_transcript = "Dit is het Langstraat Weer.\n" + forecast + "\nTot zover het Langstraat weer."

          # Sla lokaal op (optioneel, staat klaar als bestand)
          try:
              with open("Langstraat-Weer.txt", "w", encoding="utf-8") as f:
                  f.write(lang_transcript)
              print("Langstraat-Weer.txt aangemaakt.")
          except Exception as e:
              print("Waarschuwing: kon Langstraat-Weer.txt niet opslaan:", e)

          # Upload Langstraat tekst naar aparte endpoint
          upload_lang = requests.put(
              OUTPUT_URL_LANGSTRAAT,
              data=lang_transcript.encode("utf-8"),
              headers={
                  "Content-Type": "text/plain; charset=utf-8"
              },
              timeout=30
          )

          print(f"Langstraat-weer upload HTTP status: {upload_lang.status_code}")

          upload_lang.raise_for_status()

          print("Langstraat-Weer succesvol gepubliceerd.")
